<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#07070d" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="TuDomi: domicilios de restaurantes, minimarkets y tiendas de tecnología." />
    <title>TuDomi</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <script>
      // Cada interfaz (clientes / negocios / domiciliarios) se instala como una app independiente
      (function () {
        var p = location.pathname, app = 'cliente', name = 'TuDomi'
        if (p.indexOf('/negocio') === 0) { app = 'negocio'; name = 'TuDomi Negocios' }
        else if (p.indexOf('/domiciliario') === 0) { app = 'domi'; name = 'TuDomi Domis' }
        var add = function (tag, attrs) { var el = document.createElement(tag); for (var k in attrs) el.setAttribute(k, attrs[k]); document.head.appendChild(el) }
        add('link', { rel: 'manifest', href: '/manifest-' + app + '.webmanifest' })
        add('link', { rel: 'icon', type: 'image/png', href: '/icons/' + app + '-192.png' })
        add('link', { rel: 'apple-touch-icon', href: '/icons/' + app + '-180.png' })
        add('meta', { name: 'apple-mobile-web-app-title', content: name })
        document.title = name
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
